name: Deploy GitHub Pages

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions: {}

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'push' ||
      github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect validated ONPE snapshot
        id: collect
        continue-on-error: true
        run: npm run collect:onpe
      - name: Report unavailable official data
        if: ${{ always() && steps.collect.outcome == 'failure' }}
        run: |
          echo "::warning::Falló la recolección de ONPE; consulte su registro."
          printf '%s\n' \
            '### Recolección de ONPE fallida' \
            'Datos oficiales temporalmente no disponibles.' \
            'Consulte el registro del paso de recolección para ver el error.' \
            'No se generó un snapshot de respaldo ni cifras ficticias.' \
            'Sin un snapshot válido, el panel se publica sin métricas.' \
            'La publicación exige pruebas, comprobaciones y compilación.' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Run tests
        run: npm test
      - name: Run structural checks
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
